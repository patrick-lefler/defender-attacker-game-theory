project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - 01-the-game.qmd
    - 02-allocation.qmd
    - 03-robustness.qmd
    - 04-governance.qmd
    - reproducibility.qmd
    - license.qmd

website:
  favicon: assets/images/favicon.svg
  search: false
  page-navigation: true
  sidebar:
    logo: assets/images/logo.svg
    logo-alt: "Seeking Eureka"
    style: floating
    contents:
      - href: index.qmd
        text: Executive Summary
      - href: 01-the-game.qmd
        text: The Game
      - href: 02-allocation.qmd
        text: Allocation
      - href: 03-robustness.qmd
        text: Robustness
      - href: 04-governance.qmd
        text: Governance
      - href: reproducibility.qmd
        text: Reproducibility
  page-footer:
    center: "© 2026 Patrick Lefler ⦁ [MIT License](license.qmd) ⦁ Built with R & Quarto"
format:
  html:
    code-copy: true
    code-fold: true
    code-overflow: wrap
    code-tools: true
    df-print: paged
    fig-align: center 
    fig-width: 10
    fig-height: 6
    highlight-style: arrow
    lightbox: true
    linkcolor: "#0166CC"
    number-sections: false
    page-layout: full
    smooth-scroll: true
    theme: [sandstone, theme.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "contents"

execute:
  warning: false
  message: false
  freeze: auto
